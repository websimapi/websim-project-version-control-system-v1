<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Version Control System - V14</title>
  <link rel="stylesheet" href="v14/styles.css">
</head>
<body>
  <div class="version-switch-progress">
    <div class="progress-bar" style="width: 0%"></div>
  </div>

  <div class="version-container">
    <h1 class="version-header">Project Version Control System</h1>
    
    <div class="command-quick-access">
      <h3>Quick Commands</h3>
      <div class="command-buttons">
        <button class="command-btn" data-command="!list">List Versions</button>
        <button class="command-btn" data-command="!tree">Show Tree</button>
        <button class="command-btn" data-command="!branches">Show Branches</button>
        <button class="command-btn" data-command="!visual">Visual Branches</button>
        <button class="command-btn" data-command="!detailed">Detailed View</button>
        <button class="command-btn" data-command="!history">Merge History</button>
        <button class="command-btn" data-command="!timeline">Timeline</button>
        <button class="command-btn" data-command="!metrics">Metrics</button>
        <button class="command-btn" data-command="!storage">Storage Info</button>
        <button class="command-btn" data-command="!loaded">Show Loaded Files</button>
        <button class="command-btn" data-command="!help">Help</button>
      </div>
    </div>

    <div class="command-center">
      <input type="text" id="command-input" placeholder="Enter command (e.g., !list, !switch v5, !timeline)">
      <button id="execute-command">Execute</button>
    </div>
    
    <div id="version-display" class="version-display">
      <!-- Version information will be displayed here -->
    </div>
    
    <div id="command-history" class="command-history">
      <h3>Command History</h3>
      <ul id="history-list"></ul>
    </div>
  </div>

  <!-- Load initial version control system -->
  <script src="version_control.js"></script>
  
  <!-- Load version 1 by default -->
  <script src="v1/main.js"></script>
  
  <!-- Initialize latest version -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.project = new ProjectV14();
      project.initialize();
    });
  </script>

</body>
</html>
