<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Version Control System - V2</title>
  <link rel="stylesheet" href="v2/styles.css">
</head>
<body>
  <div class="version-container">
    <h1 class="version-header">Project Version Control System</h1>
    <div class="command-center">
      <input type="text" id="command-input" placeholder="Enter command (e.g., !list, !info v1, !diff v1 v2)">
      <button id="execute-command">Execute</button>
    </div>
    <div id="version-display" class="version-display">
      <!-- Version information will be displayed here -->
    </div>
    <div id="command-history" class="command-history">
      <h3>Command History</h3>
      <ul id="history-list"></ul>
    </div>
  </div>

  <script src="version_control.js"></script>
  <script src="v2/main.js"></script>
  <script>
    const project = new ProjectV2();
    project.initialize();
  </script>
